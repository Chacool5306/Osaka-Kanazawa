<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE6">
<title>Osaka &amp; Kanazawa</title>
<style>
:root{
 --paper:#f3efe6; --paper2:#fbf8f1; --ink:#1d2529; --muted:#77766f;
 --red:#c64b3c; --red2:#a9362b; --navy:#20323a; --gold:#a77b42;
 --line:#d9d1c3; --green:#486a57; --shadow:0 12px 30px rgba(38,32,24,.08);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;padding-bottom:92px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#7c6b5422 .55px,transparent .55px);background-size:5px 5px}
button,input{font:inherit}
.hero{position:relative;overflow:hidden;padding:calc(26px + env(safe-area-inset-top)) 20px 26px;background:var(--navy);color:#fff}
.hero:after{content:"旅";position:absolute;right:-6px;top:-31px;font-family:serif;font-size:155px;font-weight:800;color:#fff;opacity:.045;transform:rotate(6deg)}
.kicker{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.22em;color:#dfc6a0;text-transform:uppercase}
.hero h1{font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-weight:500;font-size:31px;line-height:1.05;margin:9px 0 8px}
.hero .jp{font-size:13px;opacity:.7;letter-spacing:.08em}
.route{display:flex;align-items:center;gap:10px;margin-top:21px;font-size:12px;color:#e8e0d3}
.route .dash{height:1px;flex:1;background:linear-gradient(90deg,#e8e0d3,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:18px;border:1px solid #ffffff1f;border-radius:13px;overflow:hidden}
.stat{padding:10px 7px;background:#ffffff08;text-align:center}.stat b{display:block;font-family:Georgia,serif;font-size:18px}.stat span{font-size:10px;opacity:.65}
.wrap{max-width:760px;margin:auto;padding:0 15px}
.daystrip{display:flex;gap:8px;overflow:auto;padding:15px 0 12px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 78%,transparent)}
.daystrip::-webkit-scrollbar{display:none}
.daybtn{border:1px solid var(--line);background:var(--paper2);color:var(--muted);border-radius:13px;padding:9px 13px;min-width:67px;box-shadow:none}
.daybtn b{display:block;font-family:Georgia,serif;font-size:14px;color:var(--ink)}.daybtn small{font-size:10px}
.daybtn.on{background:var(--red);border-color:var(--red);color:#fbe9df}.daybtn.on b{color:#fff}
.dayhead{padding:12px 3px 18px;display:flex;justify-content:space-between;align-items:end}
.dayhead .num{font-family:Georgia,serif;color:var(--red);font-size:12px;letter-spacing:.15em}
.dayhead h2{font-family:Georgia,"Noto Serif KR",serif;font-size:28px;font-weight:500;margin:3px 0 0}
.dayhead .city{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.timeline{position:relative;margin-left:6px}.timeline:before{content:"";position:absolute;left:73px;top:7px;bottom:18px;width:1px;background:var(--line)}
.stop{display:grid;grid-template-columns:58px 26px 1fr;gap:8px;margin-bottom:13px;position:relative}
.stop .time{font-family:Georgia,serif;font-size:12px;color:#67655f;text-align:right;padding-top:14px;line-height:1.15}
.dotcol{position:relative}.dot{position:absolute;top:15px;left:8px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--red);z-index:2}
.stop.travel .dot{border-color:var(--gold);background:var(--gold)}.stop.food .dot{border-color:var(--red);background:var(--red)}.stop.hotel .dot{border-color:var(--green);background:var(--green)}
.stop.ticket .dot{border-color:#b77a20;background:#b77a20;box-shadow:0 0 0 4px #f3e5c8}
.stop.ticket .stopcard{border:1.5px solid #c89543;background:#fff8e9;box-shadow:0 9px 24px rgba(132,91,30,.12)}
.urgent{display:inline-block;margin:0 0 8px;padding:4px 7px;border-radius:6px;background:#b77a20;color:#fff;font-size:9px;font-weight:900;letter-spacing:.12em}
.stopcard{background:rgba(251,248,241,.92);border:1px solid #e4ddd0;border-radius:17px;padding:14px 14px 13px;box-shadow:0 5px 16px rgba(47,38,28,.045)}
.topline{display:flex;gap:8px;align-items:flex-start}.ico{font-size:17px;line-height:1.2}.title{font-size:16px;font-weight:780;line-height:1.3;flex:1}
.tick{appearance:none;width:21px;height:21px;border:1.5px solid #bbb2a5;border-radius:50%;margin:0;flex:none;background:#fff}
.tick:checked{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 5px #fff}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#ede8df;color:#66615a}
.tag.booked{background:#e3eee5;color:#42624d}.desc{font-size:12.5px;color:#66645f;line-height:1.55;margin-top:8px}
.detail{font-size:11.5px;color:#8b8379;line-height:1.5;margin-top:7px;padding-top:7px;border-top:1px dashed #ddd4c6}
.actions{display:flex;gap:7px;margin-top:10px}.map{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#fff;background:var(--navy);padding:8px 10px;border-radius:9px;font-size:11px;font-weight:750}
.sectionhead{padding:21px 3px 12px}.sectionhead .eyebrow{color:var(--red);font-family:Georgia,serif;font-size:11px;letter-spacing:.14em}.sectionhead h2{font-family:Georgia,"Noto Serif KR",serif;font-size:26px;font-weight:500;margin:4px 0}.sectionhead p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.grid{display:grid;gap:10px}
.reservation-list{grid-template-columns:1fr!important;max-width:760px;margin:0 auto}.reservation-list .simple{width:100%}.simple{background:var(--paper2);border:1px solid #e3dbce;border-radius:16px;padding:14px;box-shadow:0 5px 16px #352a1c0a}
.simple .place{font-weight:780;font-size:15px}.simple .region{font-size:11px;color:var(--red);margin-top:4px}.simple .meta{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:7px}
.search{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:13px 14px;outline:none;margin-bottom:10px}
.filters{display:flex;gap:7px;flex-wrap:wrap;overflow:visible;margin-bottom:13px;scrollbar-width:none}.filters .filter{flex:0 0 auto}
.planhero{margin:10px 0 16px;padding:19px;border-radius:20px;background:linear-gradient(135deg,#20323a,#304952);color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.planhero:after{content:'B';position:absolute;right:14px;top:-20px;font:900 100px Georgia,serif;color:#fff;opacity:.05}.planhero small{color:#dfc6a0;letter-spacing:.14em}.planhero h2{margin:5px 0 7px;font:500 25px Georgia,'Noto Serif KR',serif}.planhero p{margin:0;max-width:85%;font-size:12px;line-height:1.55;color:#e7e2da}.countline{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 9px;font-size:11px;color:var(--muted)}
.pbcard{position:relative}.pbnum{position:absolute;right:13px;top:12px;font:italic 12px Georgia,serif;color:#b9b0a4}.kind{display:inline-block;margin-top:7px;font-size:10px;color:#6f665c;background:#eee7db;padding:4px 7px;border-radius:999px}.filter{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:11px;color:#666}.filter.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;color:#999;padding:45px 10px}
.bottomnav{position:fixed;z-index:50;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(247,243,235,.92);backdrop-filter:blur(16px);border-top:1px solid #ddd5c8}
.bottominner{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.navbtn{border:0;background:transparent;color:#8a857d;padding:7px 2px 4px;font-size:10px;border-radius:11px}.navbtn i{font-style:normal;display:block;font-size:19px;margin-bottom:2px}.navbtn.on{color:var(--red);background:#fff8}
@media(min-width:700px){.hero{border-radius:0 0 28px 28px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>

 let tags=[]; if(r['카테고리']) tags.push(`<span class="tag">${esc(r['카테고리'])}</span>`); if(r['예약 체크']==='완료')tags.push('<span class="tag booked">✓ 예약완료</span>');
 let urgent=t==='ticket'?'<span class="urgent">IMPORTANT · TICKET PICK-UP</span>':'';
 return `<article class="stop ${t}"><div class="time">${esc(r['시간']||'')}</div><div class="dotcol"><span class="dot"></span></div><div class="stopcard">${urgent}<div class="topline"><span class="ico">${icon(r)}</span><div class="title">${esc(r['항목명'])}</div><input class="tick" type="checkbox" ${done?'checked':''} data-k="${esc(k)}"></div>${tags.length?`<div class="tags">${tags.join('')}</div>`:''}${r['여행지 설명']?`<div class="desc">${esc(r['여행지 설명'])}</div>`:''}${r['이동편(출발→도착)']?`<div class="detail">이동 · ${esc(r['이동편(출발→도착)'])}</div>`:''}${r['예약번호·좌석·상세']?`<div class="detail">${esc(r['예약번호·좌석·상세'])}</div>`:''}${r['비고']?`<div class="detail">${esc(r['비고'])}</div>`:''}<div class="actions">${mapLink(r)}</div></div></article>`
}
const city={1:'SEOUL → OSAKA',2:'OSAKA',3:'OSAKA → KANAZAWA',4:'KANAZAWA',5:'KANAZAWA → SEOUL'};
const daytitle={1:'도착, 그리고 첫 저녁',2:'난바에서 우메다까지',3:'가나자와로',4:'천천히 걷는 가나자와',5:'집으로 돌아가는 날'};
function bindChecks(){document.querySelectorAll('.tick').forEach(c=>c.onchange=()=>localStorage.setItem('done:'+c.dataset.k,c.checked?'1':'0'))}
function simple(r){
 let k=key(r),done=localStorage.getItem('done:'+k)==='1';
 return `<div class="simple"><div style="display:flex;gap:9px;align-items:start"><div style="flex:1"><div class="place">${esc(r['항목명'])}</div>${r['비고']?`<div class="region">${esc(r['비고'])}</div>`:''}</div><input class="tick" type="checkbox" ${done?'checked':''} data-k="${esc(k)}"></div>${r['여행지 설명']?`<div class="meta">${esc(r['여행지 설명'])}</div>`:''}${r['예약번호·좌석·상세']?`<div class="meta">${esc(r['예약번호·좌석·상세'])}</div>`:''}${mapLink(r)}</div>`
}
function render(){
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 if(tab==='schedule'){
  let arr=D.schedule.filter(x=>String(x.Day)===day);
  app.innerHTML=`<div class="daystrip">${[1,2,3,4,5].map(d=>`<button class="daybtn ${String(d)===day?'on':''}" onclick="day='${d}';render()"><b>DAY ${d}</b><small>10/${d+3}</small></button>`).join('')}</div><div class="dayhead"><div><div class="num">${city[day]}</div><h2>${daytitle[day]}</h2></div><div class="city">${arr.length} stops<br>${arr[0]?.['날짜']||''}</div></div><section class="timeline">${arr.map(stop).join('')}</section>`;
 } else if(tab==='reservation'){
  app.innerHTML=`<div class="sectionhead"><div class="eyebrow">BOOKING WALLET</div><h2>예약 한눈에 보기</h2><p>현장에서 필요한 예약번호와 좌석 정보를 빠르게 확인해.</p></div><div class="grid reservation-list">${D.reserv.map(simple).join('')}</div>`;
 } else if(tab==='shopping'){
  app.innerHTML=`<div class="sectionhead"><div class="eyebrow">SHOPPING NOTE</div><h2>사올 것들</h2><p>체크하면 이 기기에서 완료 상태가 유지돼.</p></div><div class="grid">${D.shopping.map(simple).join('')}</div>`;
 } else {
  const regs=[...new Set(D.planb.map(x=>(x['비고']||'').split('|')[0].trim()).filter(Boolean))];
  app.innerHTML=`<div class="planhero"><small>PLAN B · ${D.planb.length} PLACES</small><h2>계획이 바뀌어도 괜찮아.</h2><p>웨이팅이 길거나 시간이 남을 때, 지금 있는 동네에서 바로 갈 수 있는 후보를 골라봐.</p></div><input class="search" id="q" placeholder="⌕  식당 · 관광지 · 지역 검색"><div class="filters"><button class="filter on" data-r="">전체 ${D.planb.length}</button>${regs.map(r=>`<button class="filter" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div><div class="countline"><span id="pbcount"></span><span>지도 버튼으로 바로 이동</span></div><div class="grid" id="pb"></div>`;
  let region=''; const q=document.querySelector('#q'),pb=document.querySelector('#pb');
  const draw=()=>{let s=q.value.trim().toLowerCase();let a=D.planb.filter(x=>(!region||(x['비고']||'').includes(region))&&(!s||JSON.stringify(x).toLowerCase().includes(s)));document.querySelector('#pbcount').textContent=`${a.length}곳`;pb.innerHTML=a.length?a.map((r,i)=>{let base=simple(r);return base.replace('class="simple"','class="simple pbcard"').replace('<div style="display:flex','<span class="pbnum">'+String(i+1).padStart(2,'0')+'</span><div style="display:flex').replace('</div>'+mapLink(r),'</div><span class="kind">'+esc(r['카테고리']||'기타')+'</span>'+mapLink(r))}).join(''):'<div class="empty">조건에 맞는 Plan B가 없어.</div>';bindChecks()};
  q.oninput=draw;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{region=b.dataset.r;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));draw()});draw(); return;
 }
 bindChecks();
}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>

</body></html>
